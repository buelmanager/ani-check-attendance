<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1E3A5F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ANI CHECK" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="ANI CHECK" />
    <meta name="description" content="스마트 출결 관리 시스템" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />

    <!-- Manifest (동적으로 설정) -->
    <link rel="manifest" id="manifest-link" href="/manifest.json" />

    <title>ANI CHECK - 스마트 출결 관리</title>

    <!-- 경로에 따라 manifest 변경 -->
    <script>
      (function() {
        var path = window.location.pathname;
        var manifestLink = document.getElementById('manifest-link');
        if (path.startsWith('/admin')) {
          manifestLink.href = '/manifest-admin.json';
        }
      })();
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
